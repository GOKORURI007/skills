[project]
name = "skills"
version = "0.1.0"
description = "Install skills from this repo into agent skill directories via uvx."
readme = "README.md"
authors = [
    { name = "GOKORURI007", email = "qq@yjc.anonaddy.me" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "pathspec>=0.12",
]

[project.scripts]
skills = "skills.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]