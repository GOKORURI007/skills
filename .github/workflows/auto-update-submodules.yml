name: Auto Update Submodules

on:
  # 定时触发（使用 Cron 表达式）
  schedule:
    # 示例：每天 UTC 00:00（北京时间早上 8:00）运行一次
    - cron: '0 0 * * *'

  # 支持在 GitHub 页面手动点击按钮触发
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出主仓库（需包含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 需要检出子模块
          submodules: true
          # 使用深度 0 确保拉取完整历史，避免提交冲突
          fetch-depth: 0
          # 如果子仓库是私有的，需要在此配置包含读取权限的 PAT Token
          # token: ${{ secrets.SUBMODULE_PAT }}

      # 2. 更新子模块到最新提交
      - name: Update submodules
        run: |
          # 远端拉取并更新所有子模块至各自追踪分支的最新版本
          git submodule update --remote --merge

      # 3. 检查变更并提交推送
      - name: Commit and push changes
        run: |
          # 配置 Git 提交身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有子模块指针更新
          if [[ -n $(git status --porcelain) ]]; then
            echo "Submodules updated. Committing changes..."
            git add .
            git commit -m "chore: auto update submodules [skip ci]"
            git push
          else
            echo "No submodule updates found."
          fi
